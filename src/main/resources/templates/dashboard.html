<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Dashboard | Campus Mate</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="dashboard-page"><main class="dashboard-card"><header class="dashboard-header"><div><p class="eyebrow">STUDENT PORTAL</p><h1>Student Dashboard</h1><p>Welcome, <strong th:text="${student.name}">Student</strong></p></div><form th:action="@{/logout}" method="post"><button class="button secondary" type="submit">Log out</button></form></header>
<p><a class="button" th:href="@{/notices}">View campus notices</a></p><section class="profile-grid" aria-label="Student account information"><article><span>EMAIL</span><strong th:text="${student.email}">student@example.test</strong></article><article><span>DEPARTMENT</span><strong th:text="${student.department}">Department</strong></article><article><span>SEMESTER</span><strong th:text="${student.semester}">1</strong></article></section>
<footer>Campus Mate · Student Portal</footer></main></body></html>
