<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Campus Notices | Campus Mate</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="dashboard-card"><header class="dashboard-header"><div><p class="eyebrow">CAMPUS MATE / BULLETIN</p><h1>Campus Notices</h1></div><a class="button secondary" th:href="@{/dashboard}">Dashboard</a></header>
<section class="notice-list" th:if="${!#lists.isEmpty(notices)}"><article class="notice-card" th:each="notice : ${notices}"><p class="notice-meta"><span th:text="${notice.category}">General</span> · <time th:text="${#temporals.format(notice.date,'dd MMM yyyy')}">01 Jan</time></p><h2 th:text="${notice.title}">Notice title</h2><p th:text="${notice.description}">Notice description</p></article></section>
<p class="empty-state" th:if="${#lists.isEmpty(notices)}">No notices are available.</p></main></body></html>
