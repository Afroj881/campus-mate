<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timetable | Campus Mate</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="student-dashboard student-notices-page">
    <main class="student-notices-main">
        <header class="student-notices-header">
            <a class="dashboard-brand" th:href="@{/dashboard}" aria-label="Campus Mate Student Dashboard">
                <span class="dashboard-brand-mark" aria-hidden="true">CM</span>
                <span class="dashboard-brand-copy">Campus Mate<small>STUDENT PORTAL</small></span>
            </a>
            <a class="notices-back-link" th:href="@{/dashboard}">Back to dashboard</a>
        </header>
        <section class="student-notices-intro">
            <p class="dashboard-eyebrow">STUDENT PORTAL <span aria-hidden="true">/</span> CLASS SCHEDULE</p>
            <h1>Timetable</h1>
            <p>Weekly classes, ordered by day and start time.</p>
        </section>
        <section class="dashboard-panel notice-management-panel" aria-label="Weekly timetable" th:if="${!#lists.isEmpty(timetableEntries)}">
            <div class="notice-table-wrap">
                <table class="notice-table">
                    <thead><tr><th>Day</th><th>Subject</th><th>Faculty</th><th>Room</th><th>Time</th></tr></thead>
                    <tbody>
                        <tr th:each="entry : ${timetableEntries}">
                            <td class="notice-table-date" th:text="${#strings.capitalize(#strings.toLowerCase(entry.day.name()))}">Monday</td>
                            <td class="notice-table-title" th:text="${entry.subject}">Subject</td>
                            <td th:text="${entry.faculty}">Faculty</td>
                            <td th:text="${entry.room}">Room</td>
                            <td class="notice-table-date"><span th:text="${#temporals.format(entry.startTime, 'HH:mm')}">09:00</span> - <span th:text="${#temporals.format(entry.endTime, 'HH:mm')}">10:00</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <div class="empty-state student-notices-empty" th:if="${#lists.isEmpty(timetableEntries)}">
            <span class="empty-state-mark" aria-hidden="true">T</span>
            <strong>No timetable available.</strong>
        </div>
    </main>
</body>
</html>
