<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage Notices | Campus Mate</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="dashboard-card"><header class="dashboard-header"><div><p class="eyebrow">CAMPUS MATE / ADMIN</p><h1>Manage Notices</h1></div><a class="button" th:href="@{/admin/notices/new}">Add Notice</a></header>
<p class="success" th:if="${successMessage}" th:text="${successMessage}"></p>
<section class="notice-list" th:if="${!#lists.isEmpty(notices)}"><article class="notice-card" th:each="notice : ${notices}"><p class="notice-meta"><span th:text="${notice.category}">General</span> · <time th:text="${#temporals.format(notice.date,'dd MMM yyyy')}">01 Jan</time></p><h2 th:text="${notice.title}">Notice title</h2><p th:text="${notice.description}">Notice description</p><div class="actions"><a class="button secondary" th:href="@{/admin/notices/edit/{id}(id=${notice.id})}">Edit</a><form th:action="@{/admin/notices/delete/{id}(id=${notice.id})}" method="post"><button class="button danger" type="submit">Delete</button></form></div></article></section>
<p class="empty-state" th:if="${#lists.isEmpty(notices)}">No notices available. Add the first notice.</p></main></body></html>
