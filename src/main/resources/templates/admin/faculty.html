<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Faculty Management | Campus mate</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="student-dashboard">
<div class="dashboard-shell">
    <aside class="dashboard-sidebar">
        <a class="dashboard-brand" href="/dashboard/admin">
            <span class="dashboard-brand-mark" aria-hidden="true">CM</span>
            <span class="dashboard-brand-copy">Campus Mate<small>ADMIN PORTAL</small></span>
        </a>
        <nav class="dashboard-nav">
            <a class="dashboard-nav-link" th:href="@{/dashboard/admin}"><span class="dashboard-nav-icon" aria-hidden="true">01</span>Dashboard</a>
            <a class="dashboard-nav-link is-active" th:href="@{/admin/faculty}"><span class="dashboard-nav-icon" aria-hidden="true">02</span>Faculty</a>
            <a class="dashboard-nav-link" th:href="@{/admin/subjects}"><span class="dashboard-nav-icon" aria-hidden="true">03</span>Subjects</a>
            <a class="dashboard-nav-link" th:href="@{/admin/teacher-subject-assignments}"><span class="dashboard-nav-icon" aria-hidden="true">04</span>Assignments</a>
        </nav>
    </aside>
    <main class="dashboard-main">
        <header class="dashboard-header">
            <div>
                <p class="dashboard-eyebrow">ADMIN PORTAL <span aria-hidden="true">/</span> FACULTY</p>
                <h1>Faculty Management</h1>
            </div>
        </header>
        <section class="dashboard-content-grid">
            <article class="dashboard-panel">
                <form class="admin-form" th:action="@{/admin/faculty}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="admin-form-field"><label for="faculty-name">Name</label><input id="faculty-name" name="name" type="text" required></div>
                    <div class="admin-form-field"><label for="faculty-email">Email</label><input id="faculty-email" name="email" type="email" required></div>
                    <div class="admin-form-field"><label for="faculty-password">Password</label><input id="faculty-password" name="password" type="password" required></div>
                    <div class="admin-form-field"><label for="faculty-department">Department</label><input id="faculty-department" name="department" type="text" required></div>
                    <div class="admin-form-field"><label for="faculty-semester">Semester</label><input id="faculty-semester" name="semester" type="number" min="1" required></div>
                    <div class="admin-form-field"><label for="faculty-section">Section</label><input id="faculty-section" name="section" type="text" maxlength="10" value="A"></div>
                    <button class="auth-submit" type="submit">Create faculty</button>
                </form>
            </article>
            <article class="dashboard-panel">
                <div class="notice-preview-list" th:if="${!#lists.isEmpty(facultyMembers)}">
                    <div class="notice-preview" th:each="facultyMember : ${facultyMembers}">
                        <span class="notice-preview-copy">
                            <strong th:text="${facultyMember.name}">Faculty</strong>
                            <small th:text="${facultyMember.email + ' · ' + facultyMember.department}">email</small>
                        </span>
                    </div>
                </div>
            </article>
        </section>
    </main>
</div>
</body>
</html>
