<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | Campus Mate</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head><body><main class="welcome form-card"><p class="eyebrow">STUDENT ACCOUNT</p><h1>Create your account</h1>
<form th:action="@{/register}" th:object="${registrationForm}" method="post">
<label>Name <input th:field="*{name}" autocomplete="name" required></label><small class="error" th:errors="*{name}"></small>
<label>Email <input th:field="*{email}" type="email" autocomplete="email" required></label><small class="error" th:errors="*{email}"></small>
<label>Password <input th:field="*{password}" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><small class="error" th:errors="*{password}"></small>
<label>Department <input th:field="*{department}" required></label><small class="error" th:errors="*{department}"></small>
<label>Semester <input th:field="*{semester}" type="number" min="1" required></label><small class="error" th:errors="*{semester}"></small>
<button class="button" type="submit">Register</button></form><p><a th:href="@{/login}">Already registered? Sign in</a></p></main></body></html>
