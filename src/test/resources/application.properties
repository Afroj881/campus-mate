spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_mate}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
campusmate.admin.seed.enabled=false
app.upload.dir=${java.io.tmpdir}/campus-mate-tests/resources
app.upload.max-file-size=10485760
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB
